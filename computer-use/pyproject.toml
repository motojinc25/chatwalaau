# chatwalaau-computer-use -- the ChatWalaau Computer Use desktop provider as a binary wheel
# (PRP-0191, UDR-0173 D4, CTR-0238).
#
# maturin `bindings = "bin"` packs the release executable into a platform wheel
# (py3-none-win_amd64): installing it puts `chatwalaau-computer-use.exe` in the
# environment's scripts directory. There is no Python module to import.
#
# The metadata below is STATIC (no `dynamic` field) so `uv lock` can resolve this package
# without building it.

[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "chatwalaau-computer-use"
version = "0.1.0"
description = "ChatWalaau Computer Use desktop provider: a native stdio MCP server (chatwalaau.computer-use/1)"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Jingun Jung" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Rust",
    "Topic :: Desktop Environment",
]

[project.urls]
Homepage = "https://github.com/motojinc25/chatwalaau"
Issues = "https://github.com/motojinc25/chatwalaau/issues"

[tool.maturin]
bindings = "bin"
profile = "release"
strip = true
# The fake-desktop feature is test-only and is never enabled for a wheel (UDR-0173 D8).
features = []

# No generated Rust SBOM in the wheel: maturin's records the build checkout's local path.
[tool.maturin.sbom]
rust = false

# Local rebuilds. While backend/pyproject.toml resolves this package
# from ../computer-use, uv rebuilds it only when one of these files changes -- by default it would
# watch pyproject.toml alone and ignore every Rust change. Force one with
# `uv sync --reinstall-package chatwalaau-computer-use` (pnpm run computer-use:reinstall).
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "src/**/*.rs" },
]
