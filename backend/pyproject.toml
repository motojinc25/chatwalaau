[project]
name = "chatwalaau"
version = "0.169.0"
description = "ChatWalaʻau -- The localhost AI Agent. Named in Hawaiian, built in Hawaiʻi."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Jingun Jung" }]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Framework :: FastAPI",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic-settings>=2.9.0",
    "python-dotenv>=1.1.0",
    # Microsoft Agent Framework family: EXACT pins (PRP-0182, UDR-0164 D1;
    # policy from PRP-0108, UDR-0086 D1; method from PRP-0126, UDR-0109 D1/D2).
    # MAF ships breaking changes inside minor releases (1.8.0 async Skill lookup,
    # 1.9.0 MCP sampling guardrails, 1.10.0 SkillsProvider approval-by-default,
    # 1.11.0 SkillsProvider caching split + nested SKILL.md absorption + AG-UI
    # interrupt canonicalization, 1.12.0 AG-UI TOOL_CALL for workflow participants,
    # 1.14.0 Foundry encrypted-reasoning opt-in + skills reparse-point rejection,
    # 1.15.0 history de-duplication at the save seam + OTel semconv consolidation,
    # 1.17.0 sequence-only agent middleware + `agent-hooks` core extra removal,
    # 1.18.0 storage-key derivation + ranged file reads + masked SecretString +
    # Lab removed from core[all], 1.19.0 per-request Anthropic parsing state passed
    # POSITIONALLY to `_prepare_options` + hosted/local shell-call separation);
    # a version bump is a deliberate, PRP-reviewed act, never a routine refresh.
    #
    # 1.19.0's breaking change for THIS codebase is filed under "Fixed" (#8237):
    # the Anthropic connector calls `_prepare_options(messages, options,
    # request_state, **kwargs)`. An override that does not accept positional extras
    # fails EVERY Anthropic request with TypeError (PRP-0182 M6), so every
    # `_prepare_options` override forwards `*args, **kwargs` (UDR-0164 D4), and a
    # send-path test drives each built client through `get_response`.
    #
    # The family does NOT share a version line (UDR-0109 D1, carried by UDR-0129 D1
    # and reaffirmed unamended by UDR-0131 D1, UDR-0139 D1, UDR-0162 D1 and UDR-0164
    # D1): each package is pinned at the version published in the SAME release wave
    # as `agent-framework==1.19.0` (2026-09-18), so the declared set and the resolved
    # set are identical for uv.lock AND for a bare `pip install chatwalaau`.
    #
    # A package that published NO artifact in the target wave is HELD at its current
    # pin, and REJOINS at the first wave that does publish it -- at that wave's
    # build, in ONE step, however many waves it missed. The 1.19.0 wave is the second
    # FULL wave in a row: nothing is held.
    #
    # Transitive GA family packages are NOT declared (UDR-0109 D2) but are moved in
    # uv.lock to their wave-consistent GA build (UDR-0162 D2, UDR-0164 D2):
    # agent-framework-orchestrations 1.2.0 (1.19.0 wave), agent-framework-github-copilot
    # 2.0.0 (no 1.19.0-wave build). A fresh resolve of the whole lock is its own
    # proposal (UDR-0162 D2.4).
    "agent-framework==1.19.0",
    "agent-framework-ag-ui==1.4.0",
    # NOTE (PRP-0183, UDR-0165 D4): `agent-framework-devui` is deliberately NOT
    # declared. The DevUI integration is removed from the product, so nothing in
    # `app/` imports or subclasses it and UDR-0109 D2 no longer requires a
    # declaration. The wheel STAYS in the lock as an undeclared transitive of
    # `agent-framework-core[all]`, like the rest of the family the product never
    # imports; no wave proposal verifies it again (D6).
    # Harness shell tooling (PRP-0182, UDR-0164 D3). DECLARED because ChatWalaʻau
    # SUBCLASSES it: app/agent/harness/shell.py `WorkspaceShellTool(LocalShellTool)`,
    # which also reads the private `_stateless_argv` (UDR-0110 D2 residue). It was
    # resolved only transitively from PRP-0135 until PRP-0182 -- a UDR-0109 D2
    # violation; beta packages are not exempt (anthropic is beta and declared for
    # the same reason). 1.0.0b260918 (#8206) resets PowerShell's
    # $LASTEXITCODE in PERSISTENT sessions, which the stateless workspace shell
    # does not use.
    "agent-framework-tools==1.0.0b260918",
    # Declared because ChatWalaʻau SUBCLASSES it and overrides the private
    # `_prepare_options` chokepoint (app/providers/azure_openai.py, PRP-0082 /
    # UDR-0058). An undeclared package is an unpinned package (UDR-0109 D2).
    # 1.13.0 gates approval-content serialization behind `_is_hosted_tool_approval`
    # (UDR-0128 D5): local approvals are no longer serialized to the provider.
    # 1.14.1 (#7705) fixes streaming when a GenAI instrumentor replaces the raw SDK
    # response -- a latent failure on the traced streaming path, which is the same
    # area published as BREAKING 1 of v0.140.0.
    # 1.14.2 (#7964) stops discarding falsey provider values: a tool returning 0 /
    # False / a dict used to reach the provider as an empty string, and zero-valued
    # usage detail counters used to be dropped from `usage_details` (FEAT-0066).
    # It also reorders Azure client construction -- a credential now WINS over a
    # configured API key instead of coexisting with it (PRP-0161 F5, unfiled
    # upstream; see assets/docs/guides/model-providers.md).
    # 1.14.3 accepts a SecretString api_key (#8127) and loads its exports lazily
    # (#8219). `_prepare_options` is byte-identical to 1.14.2 (PRP-0180 M5).
    # 1.14.4 (#8294) keeps a Responses `shell_call` LOCAL only when the item says
    # environment.type == "local"; anything else becomes a hosted shell_tool_call
    # nothing here executes. The harness shell must stay local (UDR-0164 D5).
    # `_prepare_options` is unchanged at 1.14.4 (PRP-0182 M5).
    "agent-framework-openai==1.14.4",
    # Anthropic (Claude) base-model provider, Direct + Foundry hostings
    # (PRP-0069, UDR-0045 D8). Already resolved transitively via
    # agent-framework-core[all]; declared explicitly to guarantee the capability.
    # 1.0.0b260827 (#7850) passes UNMAPPED provider stop reasons through instead of
    # reporting no finish reason; `finish_reason` is not read anywhere in app/.
    # `_prepare_options` is still SYNC (app/providers/anthropic `_PromptCacheMixin`
    # does not await its super()) -- measured, not assumed.
    #
    # REJOINS at the 1.18.0-wave build after ONE held wave (UDR-0162 D1). It now
    # wraps every SDK failure in ChatClientException (#7855); the run-error
    # classifier walks the exception chain, so classification is unchanged
    # (PRP-0180 M9, UDR-0162 D4).
    #
    # 1.0.0b260918 moves per-request parsing state into an `_AnthropicRequestState`
    # passed POSITIONALLY to `_prepare_options` (#8237, filed under Fixed), which
    # broke `_PromptCacheMixin` until it forwarded `*args` (PRP-0182 F1, UDR-0164
    # D4). A stream that fails after a local call started now raises
    # ResponseInvalidatedException (a ChatClientException) and the call is not run.
    "agent-framework-anthropic==1.0.0b260918",
    # Microsoft Foundry base-model provider (PRP-0106, UDR-0085 D1): the stable
    # FoundryChatClient connector (OpenAI Responses API via a Foundry project
    # endpoint, Entra ID credential only). Already resolved transitively via the
    # agent-framework meta package; declared explicitly to guarantee the capability.
    # 1.11.0 adds its OWN `_prepare_options` that strips
    # `reasoning.encrypted_content` unless the caller asked for it; UDR-0085 D9's
    # narrower policy is re-asserted at app/providers/foundry.py (UDR-0128 D3).
    #
    # 1.13.0 (#8188) accepts Azure AI Projects up to 2.6 with OpenAI SDK 3.x; under
    # `openai<3` below, the lock keeps azure-ai-projects 2.3.0. Exports load lazily
    # (#8219). `_prepare_options` is UNTOUCHED (PRP-0180 M5), so UDR-0085 D9 /
    # UDR-0128 D3's re-assertion at app/providers/foundry.py stands unchanged.
    # 1.13.1 leaves `_prepare_options` unchanged again (PRP-0182 M5).
    "agent-framework-foundry==1.13.1",
    # Declarative agents (PRP-0094, FEAT-0051, UDR-0072): the MAF AgentFactory front
    # end (create_agent_from_yaml / create_agent_from_yaml_path) used to PARSE and
    # VALIDATE declarative agent YAML. The runtime agent is built by ChatWalaʻau
    # (UDR-0072 D2), so the package is used for schema validation only; the loader
    # degrades gracefully to its own structural checks if it is unavailable.
    #
    # REJOINS at the 1.18.0-wave build after TWO held waves (UDR-0162 D1), in one
    # step. 1.0.4 preserves HttpRequestAction query bytes (#7765; the CTR-0186 jail
    # gates on the host, unaffected) and starts a fresh run for a bare Message
    # trigger (#7839; app/workflow passes a str, unaffected -- PRP-0180 M13).
    # 1.1.0 (#8371) stops persisting response cookies in the owned HTTP client the
    # CTR-0186 jail delegates to (accepted, UDR-0164 D6); #8425 scopes MCP sessions
    # per invocation only when a client_provider is given -- the jail passes none.
    "agent-framework-declarative==1.1.0",
    # OpenAI SDK: pinned BELOW 3.x on purpose (PRP-0161 F3, UDR-0139 D3).
    # `agent-framework-openai==1.14.2` (#7967) widened its ceiling to SDK 3.x, and a
    # fresh resolve of this declared set takes openai 2.54.0 -> 3.9.0 -- a MAJOR move
    # underneath app/providers/azure_openai.py, which subclasses OpenAIChatClient and
    # overrides the private `_prepare_options` chokepoint (PRP-0082 / UDR-0058), and
    # underneath CTR-0057's Responses endpoint. UDR-0109 D2 ("an undeclared package
    # is an unpinned package") applies one level down whenever the override reaches
    # through the connector into the SDK. Adopting 3.x is its own proposal; it must
    # not ride in on a framework bump, because a regression would then be
    # unattributable to either move.
    "openai>=2.54,<3",
    "azure-identity>=1.23.0",
    "httpx>=0.28.0",
    "elevenlabs>=2.39.0",
    "chromadb>=1.0.0",
    "pymupdf>=1.25.0",
    "httpx-sse>=0.4.0",
    # Azure OpenAI Realtime API STT (gpt-realtime-whisper) needs a
    # webm/Opus -> PCM16 decoder (PyAV) and a WebSocket client.
    # Default dependencies per PRP-0061 amendment (UDR-0036 D4 revised).
    "av>=12.0",
    "websockets>=13.0",
    # Cron Scheduler: 5+ field crontab expression interpreter (PRP-0089, UDR-0067 D1).
    "croniter>=2.0.0,<3",
    # IANA timezone database so CRON_TIMEZONE named zones work on hosts without a
    # system zoneinfo (Windows). Data-only; code degrades to local tz if absent.
    "tzdata>=2024.1",
    # Microsoft Teams integration (PRP-0092, FEAT-0050, UDR-0070). The Microsoft
    # Teams SDK for Python (Teams AI Library v2). Installed by DEFAULT (operator
    # decision); it transitively pulls microsoft-teams-api / -cards / -common, so
    # only the top-level package is declared (-botbuilder is not used). The SDK is
    # still IMPORTED only when TEAMS_ENABLED (lazy, UDR-0070 D10); the floor is
    # pinned to the Python-3.12-verified release (UDR-0070 D12).
    "microsoft-teams-apps>=2.0.13",
    # Ontology Concept Modeling (PRP-0105, FEAT-0058, UDR-0084 D2): embedded RDF
    # engine (Rust-backed). >= 0.5 ships the RDF 1.2 / SPARQL 1.2 draft features
    # (rdf-12 / sparql-12) enabled by default in the Python bindings; the former
    # RDF-star is subsumed as RDF 1.2 triple terms. Imported lazily inside
    # app.ontology so the feature gate (ONTOLOGY_ENABLED) bounds its blast radius.
    "pyoxigraph>=0.5",
]

[project.optional-dependencies]
# Corporate networks behind TLS-intercepting proxies (Zscaler, Netskope,
# on-prem SSL middlebox) need Python to honour the OS certificate store
# so the in-house root CA is trusted. Opt-in: pip install "chatwalaau[corp]"
# See assets/docs/guides/initial-setup.md (PRP-0054).
corp = ["pip-system-certs>=4.0"]

[project.urls]
Homepage = "https://github.com/motojinc25/chatwalaau"
Repository = "https://github.com/motojinc25/chatwalaau"
Issues = "https://github.com/motojinc25/chatwalaau/issues"

[project.scripts]
chatwalaau = "app.cli:main"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
app = ["_frontend_dist/**/*", "_frontend_dist/*", "templates/.env.template"]

[dependency-groups]
dev = [
    "ruff>=0.15.5",
    "pytest>=8.3.0",
    "pytest-asyncio>=1.0.0",
    "pyyaml>=6.0",
    "httpx2>=2.12.0",
]
