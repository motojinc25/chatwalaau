name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      COREPACK_ENABLE_STRICT: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Check the release tag matches pyproject version
        if: github.event_name == 'release'
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' backend/pyproject.toml | head -1)
          tag="${{ github.event.release.tag_name }}"
          if [ "$tag" != "v$version" ]; then
            echo "Release tag $tag does not match pyproject version v$version"; exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build frontend
        working-directory: frontend
        run: |
          corepack enable
          corepack prepare pnpm@11.21.0 --activate
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm rebuild
          pnpm build

      - name: Bundle frontend and license into the backend package
        run: |
          rm -rf backend/src/app/_frontend_dist backend/dist
          cp -r frontend/dist backend/src/app/_frontend_dist
          cp LICENSE.md backend/LICENSE.md

      - uses: astral-sh/setup-uv@v6

      - name: Build sdist and wheel
        working-directory: backend
        run: |
          uv build
          uvx twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: backend/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/chatwalaau/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
